<style>
/* Morning Routine: tokens, base, chrome shared by every screen. Colour modes live here; the accent is set from JS. */
:root {
  --fs: 1;
  --bg: #000; --surface: #0b0c0d; --surface2: #151618; --line: #292b30; --text: #f5f2ec; --muted: #a29f97;
  --accent: #f0a92b; --accent-text: #f0a92b; --on-accent: #0a0a0a;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --f-ui: var(--sans); --f-bible: var(--sans); --f-time: var(--sans);
  --pad: 1.35rem; --gap: 1.15rem; --r: 1.5rem;
  color-scheme: dark;
}
html[data-mode="dark"] { --bg: #131417; --surface: #1b1c20; --surface2: #26282d; --line: #373a41; --text: #f3f0ea; --muted: #aba8a1; }
html[data-mode="light"] { --bg: #f6f4ee; --surface: #ffffff; --surface2: #ecebe4; --line: #d3d0c4; --text: #16171a; --muted: #55575c; color-scheme: light; }
html[data-serif="1"] { --f-bible: var(--serif); }
html[data-mono="1"] { --f-time: var(--mono); }
html[data-density="compact"] { --pad: 1rem; --gap: .75rem; --r: 1.1rem; }

* { box-sizing: border-box; }
html { font-size: calc(100% * var(--fs)); -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--text); font: 400 1rem/1.45 var(--f-ui);
  height: 100vh; height: 100dvh; overflow: hidden; overscroll-behavior: none; -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:disabled { cursor: not-allowed; }
h1, h2, h3, p { margin: 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--accent-text); outline-offset: 3px; border-radius: .5rem; }
.ic { width: 1.35rem; height: 1.35rem; flex: none; }
/* In light mode the status bar of an installed iPhone app keeps white text, so give it a dark strip to sit on. */
html[data-mode="light"] body::before { content: ""; position: fixed; z-index: 300; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px); background: #111; }

/* ---- stage and screens ---- */
#stage { position: fixed; inset: 0; overflow: hidden; }
.screen {
  position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); overflow: hidden;
  padding: env(safe-area-inset-top, 0px) max(var(--pad), env(safe-area-inset-right, 0px)) 0 max(var(--pad), env(safe-area-inset-left, 0px));
}
.in-right { animation: in-right .44s cubic-bezier(.22, .8, .26, 1) both; z-index: 2; }
.out-left { animation: out-left .44s cubic-bezier(.22, .8, .26, 1) both; z-index: 1; }
.in-left { animation: in-left .44s cubic-bezier(.22, .8, .26, 1) both; z-index: 2; }
.out-right { animation: out-right .44s cubic-bezier(.22, .8, .26, 1) both; z-index: 1; }
.in-fade { animation: fade-in .18s both; z-index: 2; }
.out-fade { animation: fade-out .18s both; z-index: 1; }
@keyframes in-right { from { transform: translateX(100%); } to { transform: none; } }
@keyframes out-left { from { transform: none; } to { transform: translateX(-28%); opacity: .35; } }
@keyframes in-left { from { transform: translateX(-100%); } to { transform: none; } }
@keyframes out-right { from { transform: none; } to { transform: translateX(28%); opacity: .35; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
@keyframes drop { from { opacity: 0; transform: translateY(-.6rem) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes rise { from { transform: translateY(100%); } to { transform: none; } }

.body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: var(--gap); padding: var(--gap) 0 calc(var(--gap) * 1.5); -webkit-overflow-scrolling: touch; }
.body > * { flex-shrink: 0; } /* a tall card must scroll, never squash the controls above it */
.dock { display: flex; flex-direction: column; gap: .6rem; padding: .8rem 0 calc(.9rem + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 78%, transparent); }

/* ---- buttons ---- */
.primary { width: 100%; min-height: 4rem; padding: .6rem 1rem; border-radius: 1.25rem; background: var(--accent); color: var(--on-accent); font-size: 1.2rem; font-weight: 800; text-align: center; transition: transform .12s; }
.primary:active { transform: scale(.985); }
.ghost { display: inline-flex; align-items: center; gap: .35rem; min-height: 2.9rem; padding: 0 1rem; border-radius: 99px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; }
.icon-btn { width: 2.9rem; height: 2.9rem; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); flex: none; }
.chip { align-self: center; display: inline-flex; gap: .4rem; align-items: center; min-height: 2.9rem; padding: 0 1.2rem; border-radius: 99px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; }
.chip .ic { width: 1.1rem; height: 1.1rem; }
.danger { min-height: 3.4rem; border-radius: 1rem; border: 1.5px solid var(--line); font-weight: 700; text-align: center; }

/* ---- top bar, "Total Morning Time Remaining" pill, progress ---- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .5rem 0 .2rem; }
.skip { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; flex: 0 1 auto; min-width: 0; min-height: 2.9rem; padding: .3rem 1rem; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: .9rem; line-height: 1.15; text-align: center; }
.skip .ic { width: 1.05rem; height: 1.05rem; flex: none; }
.pill { align-self: center; display: flex; flex-direction: column; align-items: center; padding: .5rem 1.6rem .55rem; margin: .3rem 0 .55rem; border-radius: 1.6rem; background: var(--surface); border: 1px solid var(--line); }
.pill-l { font-size: .72rem; color: var(--muted); letter-spacing: .01em; }
.pill-v { font: 700 1.65rem/1.15 var(--f-time); font-variant-numeric: tabular-nums; color: var(--accent-text); }
.prog { flex: none; margin-bottom: .2rem; }
.prog-bar { height: .45rem; border-radius: 9px; background: var(--surface2); overflow: hidden; }
.prog-bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 9px; transition: width .4s linear; }
.prog-dots { display: flex; justify-content: center; align-items: center; gap: .45rem; min-height: .9rem; }
.dot { width: .7rem; height: .7rem; border-radius: 50%; background: var(--surface2); border: 1.5px solid var(--line); transition: width .25s; }
.dot.done { background: var(--accent); border-color: var(--accent); }
.dot.cur { width: 1.9rem; border-radius: .4rem; background: var(--accent); border-color: var(--accent); }
.dot.skip { background: transparent; border-style: dashed; }
.prog-count { text-align: center; color: var(--muted); }
.prog-count b { color: var(--accent-text); }

/* ---- rings ---- */
.ring { position: relative; width: min(72vw, 17rem); aspect-ratio: 1; margin-inline: auto; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.ring-track { fill: none; stroke: var(--surface2); stroke-width: 6; }
.ring-bar { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 0; transition: stroke-dashoffset .3s linear; }
.ring-in { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.time { font: 700 clamp(2.8rem, 15vw, 4.4rem)/1 var(--f-time); font-variant-numeric: tabular-nums; }
.ring-in small { margin-top: .5rem; color: var(--muted); font-size: .85rem; }
.ring.mini { width: 5.6rem; } .ring.mini .time { font-size: 1.3rem; }
.ring.pose-ring { width: 6.6rem; } .ring.pose-ring .time { font-size: 1.55rem; }

/* ---- backdrop and confirmation sheet ---- */
.backdrop { position: fixed; inset: 0; z-index: 80; background: rgba(0, 0, 0, .58); animation: fade-in .2s both; }
.sheet-wrap { position: fixed; inset: 0; z-index: 200; display: flex; align-items: flex-end; justify-content: center; }
.sheet-wrap .backdrop { z-index: 0; } /* the dimming layer must sit under the sheet's buttons, not over them */
.sheet { position: relative; z-index: 1; width: min(100%, 32rem); display: grid; grid-template-columns: minmax(0, 1fr); gap: .8rem; background: var(--surface); border: 1px solid var(--line); border-radius: 1.6rem 1.6rem 0 0;
  padding: 1.5rem max(1.3rem, env(safe-area-inset-right, 0px)) calc(1.3rem + env(safe-area-inset-bottom, 0px)); animation: rise .26s ease-out both; }
.sheet h2 { font-size: 1.4rem; } .sheet p { color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* Home, selector, step screens, Bible reading, focus mode, yoga cards, summary. */

/* ---- home ---- */
.home { background: var(--bg); }
html[data-mode="dark"] .home, html[data-mode="light"] .home { background: radial-gradient(120% 55% at 50% 108%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 72%), var(--bg); }
.home-top { display: flex; justify-content: space-between; align-items: center; padding-top: .6rem; }
.home-main { flex: 1; display: flex; flex-direction: column; align-items: center; padding-top: clamp(.5rem, 7vh, 3.5rem); }
.lockup { display: flex; align-items: center; gap: 1rem; }
.lockup-logo { width: 4.8rem; height: 4.8rem; flex: none; }

(function () {
/* Reading plans, tracked purely by day number (Day 1, Day 2, ...). No calendar anywhere.
   Every plan is generated from chapter lengths so each day is a similar amount of reading. */
MR.plans = (function () {
  const B = MR.BOOKS, W = MR.WORDS;
  const PSALMS = 18, PROVERBS = 19, WPM = 170; // words per minute used for the "about N min" estimate

  const LIST = [
    { id: 'year', name: 'Bible in a Year', days: 365, blurb: 'The whole Bible in 365 days. Each day mixes Old Testament, a Psalm or Proverb, and New Testament.' },
    { id: 'half', name: 'Bible in ½ Year', days: 183, blurb: 'The whole Bible in 183 days, about twice the daily reading of the one-year plan.' },
    { id: 'ntps', name: 'NT & Psalms', days: 120, blurb: 'The New Testament and all 150 Psalms in 120 days.' },
    { id: 'prov', name: 'Proverbs Loop', days: Infinity, loop: 31, blurb: 'One chapter of Proverbs a day. After chapter 31 it starts over.' },
  ];

  function chapters(bookIdx) {
    const out = [];
    for (const b of bookIdx) for (let c = 1; c <= B[b][1]; c++) out.push({ b, c, w: W[b][c - 1] });
    return out;
  }
  const range = (a, z) => Array.from({ length: z - a + 1 }, (_, i) => a + i);

  /** Position of each chapter inside its own track as a 0..1 fraction of the track's total words. */
  function withFraction(seq) {
    const total = seq.reduce((n, x) => n + x.w, 0);
    let cum = 0;
    return seq.map(x => { const f = (cum + x.w / 2) / total; cum += x.w; return Object.assign({}, x, { f }); });
  }
  /** Interleave several tracks so that they progress at the same relative pace. */
  function merge(tracks) {
    const all = [];
    tracks.forEach((t, ti) => withFraction(t).forEach((x, i) => all.push(Object.assign(x, { t: ti, i }))));
    all.sort((a, b) => a.f - b.f || a.t - b.t || a.i - b.i);
    return all;
  }
  /** Cut a sequence into N consecutive days of near-equal total length, never leaving a day empty. */
  function split(seq, N) {
    const total = seq.reduce((n, x) => n + x.w, 0), target = total / N;
    const P = [0];
    seq.forEach(x => P.push(P[P.length - 1] + x.w));
    // 1) greedy first cut: a chapter joins the current day while its midpoint is before the day's boundary
    const cuts = [0];
    let i = 0, cum = 0;
    for (let d = 1; d <= N; d++) {
      const boundary = (d * total) / N;
      let took = 0;
      while (i < seq.length) {
        if (d < N && took > 0 && (cum + seq[i].w / 2 > boundary || seq.length - i <= N - d)) break;
        cum += seq[i].w; i++; took++;
      }
      cuts.push(i);
    }
    // 2) balance: nudge each day boundary by one chapter while that makes the days more even
    const cost = d => (P[cuts[d + 1]] - P[cuts[d]] - target) ** 2;
    for (let pass = 0, improved = true; improved && pass < 500; pass++) {
      improved = false;
      for (let d = 1; d < N; d++) {
        for (const step of [-1, 1]) {
          const old = cuts[d], next = old + step;
          if (next <= cuts[d - 1] || next >= cuts[d + 1]) continue; // both neighbouring days keep a chapter
          const before = cost(d - 1) + cost(d);
          cuts[d] = next;
          if (cost(d - 1) + cost(d) < before - 1e-9) improved = true; else cuts[d] = old;
        }
      }
    }
    return Array.from({ length: N }, (_, d) => seq.slice(cuts[d], cuts[d + 1]));
  }
  /** Turn one day's chapters into passages, keeping each track in reading order and joining runs like 31-33. */
  function toPassages(day) {
    const sorted = day.slice().sort((a, b) => a.t - b.t || a.i - b.i);
    const out = [];
    for (const x of sorted) {
      const last = out[out.length - 1];
      if (last && last.b === x.b && last.c2 + 1 === x.c) { last.c2 = x.c; last.words += x.w; }
      else out.push({ b: x.b, c1: x.c, c2: x.c, words: x.w });
    }
    return out;
  }

  const cache = {};
  function build(id) {
    if (cache[id]) return cache[id];
    let tracks;
    if (id === 'year' || id === 'half') {
      const ot = chapters(range(0, 38).filter(b => b !== PSALMS && b !== PROVERBS));
      const wisdom = merge([chapters([PSALMS]), chapters([PROVERBS])]);
      const nt = chapters(range(39, 65));
      tracks = [ot, wisdom, nt];
    } else if (id === 'ntps') {
      tracks = [chapters([PSALMS]), chapters(range(39, 65))];
    } else return null;
    const N = LIST.find(p => p.id === id).days;
    return (cache[id] = split(merge(tracks), N).map(toPassages));
  }

  function label(b, c1, c2) {
    const name = B[b][0];
    if (B[b][1] === 1) return name;
    const base = name === 'Psalms' && c1 === c2 ? 'Psalm' : name;
    return c1 === c2 ? `${base} ${c1}` : `${base} ${c1}–${c2}`;
  }
  const decorate = p => ({ label: label(p.b, p.c1, p.c2), b: p.b, c1: p.c1, c2: p.c2, words: p.words, genre: B[p.b][2] });

  /** The assignment for one plan on day number n (1-based). */
  function day(id, n) {
    const plan = LIST.find(p => p.id === id);
    n = Math.max(1, Math.floor(n));
    if (id === 'prov') {
      const c = ((n - 1) % 31) + 1, w = W[PROVERBS][c - 1];
      return { id, n, total: Infinity, loop: Math.floor((n - 1) / 31) + 1, complete: false, words: w,
        minutes: Math.max(1, Math.round(w / WPM)), passages: [decorate({ b: PROVERBS, c1: c, c2: c, words: w })] };
    }
    if (n > plan.days) return { id, n, total: plan.days, loop: 0, complete: true, words: 0, minutes: 0, passages: [] };
    const passages = build(id)[n - 1].map(decorate);
    const words = passages.reduce((s, p) => s + p.words, 0);
    return { id, n, total: plan.days, loop: 0, complete: false, words, minutes: Math.max(1, Math.round(words / WPM)), passages };
  }

  return { list: LIST, day, build, label, WPM };
})();

})();

    story: ['Who is in this scene, and what does each person want?', 'Where do you see God at work, even quietly?', 'What choice here is worth copying, or avoiding?', 'What does this show about God’s patience or faithfulness?', 'Mark one detail you would miss if you read faster.'],
    law: ['What does this command show about what God values?', 'What reason is given for the instruction?', 'How does this protect people, or point to something greater?', 'Which principle still applies today, even if the practice does not?', 'Note one phrase about God’s holiness or mercy.'],
    psalm: ['What is the writer feeling? Name it.', 'Turn one line into your own prayer.', 'How does the psalm move from where it starts to where it ends?', 'What does it say about who God is?', 'Is there a line you could carry with you today?'],
    wisdom: ['Choose one line to carry through the day.', 'Where could this advice change a conversation today?', 'What does it say about wisdom, and about foolishness?', 'Which part challenges you most?', 'How would you say this in your own words?'],

    vision: ['What picture of God or heaven stands out?', 'What does this ask of those who endure?', 'Note any image that repeats.', 'What hope does this give you for today?', 'What truth stays steady beneath the symbols?'],

    for (let k = 0; k < 3; k++) {
      const g = genres[k % genres.length];

  }
  return { forDay, OPEN, CUES, REFLECT, CLOSE };

  function build(flowId, targetSec) {
    const flow = FLOWS[flowId];
    targetSec = Math.max(60, Math.round(targetSec / STEP) * STEP);
    let units = flow.items.map(([id, secs]) => ({ id, base: secs, n: POSES[id].sides ? 2 : 1, secs }));

    }
    const baseTotal = units.reduce((n, u) => n + u.base * u.n, 0), k = targetSec / baseTotal;

        if (diff === 0) break;
      }
      if (!moved) break;
    }
    const segs = [];
    let t = 0;
    for (const u of units) {
      const sides = POSES[u.id].sides;
      const parts = sides ? sides.map((side, i) => ({ side, flip: i === 1 })) : [{ side: null, flip: false }];
      for (const p of parts) { segs.push({ id: u.id, side: p.side, flip: p.flip, secs: u.secs, start: t, end: t + u.secs }); t += u.secs; }

    if (t !== targetSec && segs.length) { const last = segs[segs.length - 1]; last.secs += targetSec - t; last.end += targetSec - t; }
    return segs;
  }

  /** Display title of one segment, e.g. "Neck Release" or "Quad Stretch". The side is shown separately. */
  const title = seg => POSES[seg.id].name;
  return { POSES, FLOWS, build, title, MIN_SEG };

/* 45-figure.js */
(function () {
/* Yoga figure renderer. A pose is a few joint angles (degrees; 0 = right, 90 = down, -90 = up) plus
   optional inverse-kinematics targets. The figure is drawn as rounded limbs so poses read at a glance.
   Pure string output, no DOM access. */
MR.figure = (function () {
  const S = { torso: 34, head: 14, ua: 22, fa: 20, th: 30, sh: 28, ft: 10 };
  const WID = { torso: 15, ua: 6.5, fa: 5.5, th: 9.5, sh: 7.5, ft: 5.5, sb: 8, hb: 10 };
  const FLOOR = 132, HEAD_R = 8.2;
  const rad = a => (a * Math.PI) / 180;
  const mv = (p, a, len) => [p[0] + Math.cos(rad(a)) * len, p[1] + Math.sin(rad(a)) * len];
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const r1 = n => Math.round(n * 10) / 10;

  /** Two-bone inverse kinematics. bend = +1 / -1 picks which side the middle joint bends toward. */
  function ik(a, t, l1, l2, bend) {
    let dx = t[0] - a[0], dy = t[1] - a[1], d = Math.hypot(dx, dy);
    const maxd = l1 + l2 - 0.01;
    let end = t;
    if (d > maxd) { end = [a[0] + (dx * maxd) / d, a[1] + (dy * maxd) / d]; d = maxd; }
    if (d < 1) d = 1;
    const cosA = Math.max(-1, Math.min(1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d)));
    const th = Math.atan2(dy, dx) + bend * Math.acos(cosA);
    return { mid: [a[0] + l1 * Math.cos(th), a[1] + l1 * Math.sin(th)], end };
  }
  function chain(start, spec, l1, l2) {
    if (!spec) return [start, start, start];
    if (spec.to) { const r = ik(start, spec.to, l1, l2, spec.bend == null ? 1 : spec.bend); return [start, r.mid, r.end]; }
    const m = mv(start, spec.a[0], l1);
    return [start, m, mv(m, spec.a[1], l2)];
  }

  function solve(spec) {
    const front = spec.v === 'front';
    const P = spec.p, t = spec.t == null ? -90 : spec.t, h = spec.h == null ? t : spec.h;
    const N = mv(P, t, S.torso), H = mv(N, h, S.head);
    let sN, sF, hN, hF;
    if (front) {
      const sw = spec.sw || 30, hw = spec.hw || 14;
      sN = mv(N, t + 90, -sw / 2); sF = mv(N, t + 90, sw / 2);
      // hv: hips stacked vertically, for top-down views of someone lying on their back
      if (spec.hv) { hN = [P[0], P[1] + hw / 2]; hF = [P[0], P[1] - hw / 2]; } else { hN = [P[0] - hw / 2, P[1]]; hF = [P[0] + hw / 2, P[1]]; }
    } else { sN = sF = mv(N, t, -3); hN = hF = P; }
    const an = chain(sN, spec.an, S.ua, S.fa), af = chain(sF, spec.af, S.ua, S.fa);
    const ln = chain(hN, spec.ln, S.th, S.sh), lf = chain(hF, spec.lf, S.th, S.sh);
    const fn = spec.fn === null ? null : mv(ln[2], spec.fn == null ? 0 : spec.fn, S.ft);
    const ff = spec.ff === null ? null : mv(lf[2], spec.ff == null ? 0 : spec.ff, S.ft);
    return { front, P, N, H, t, h, sN, sF, hN, hF, an, af, ln, lf, fn, ff };
  }

  function anchors(g) {
    const a = {
      hip: g.P, low: mv(g.P, g.t, 9), mid: mv(g.P, g.t, 20), up: mv(g.P, g.t, 30), neck: mv(g.N, g.h, 6),
      sh: g.sN, shf: g.sF, elb: g.an[1], wr: g.an[2], elbf: g.af[1], wrf: g.af[2],
      thigh: mid(g.ln[0], g.ln[1]), thighf: mid(g.lf[0], g.lf[1]), knee: g.ln[1], kneef: g.lf[1],
      calf: mid(g.ln[1], g.ln[2]), calff: mid(g.lf[1], g.lf[2]), ankle: g.ln[2], anklef: g.lf[2],
      chest: [mv(g.P, g.t, 25)[0] + (g.front ? 0 : 5), mv(g.P, g.t, 25)[1]], glute: [g.P[0] - 5, g.P[1] + 1], head: g.H,
    };
    return a;
  }

  const line = (a, b, w, cls) => `<path class="${cls}" stroke-width="${w}" d="M${r1(a[0])} ${r1(a[1])}L${r1(b[0])} ${r1(b[1])}"/>`;
  const limb = (c, w1, w2, cls) => line(c[0], c[1], w1, cls) + line(c[1], c[2], w2, cls);
  /** Spine: straight, or curved when spec.tc is set (positive bulges toward the back, used for cat and cow). */
  function torso(g, spec, w) {
    if (!spec.tc) return line(g.P, g.N, w, 'fg-limb');
    const m = mid(g.P, g.N), c = mv(m, g.t - 90, spec.tc * 2);
    return `<path class="fg-limb" stroke-width="${w}" d="M${r1(g.P[0])} ${r1(g.P[1])}Q${r1(c[0])} ${r1(c[1])} ${r1(g.N[0])} ${r1(g.N[1])}"/>`;
  }

  function drawProps(props, tx) {
    let out = '';
    for (const p of props || []) {
      const x = (p.x || 0) + tx[0], y = (p.y == null ? FLOOR : p.y) + tx[1];
      if (p.k === 'chair') {
        // seat top at y, back on the left (x - 22), legs to the floor
        out += `<path class="fg-prop" stroke-width="3.2" d="M${r1(x - 22)} ${r1(y)}H${r1(x + 22)}M${r1(x - 22)} ${r1(y)}V${r1(y - 44)}M${r1(x - 20)} ${r1(y)}V${FLOOR + 3}M${r1(x + 20)} ${r1(y)}V${FLOOR + 3}"/>`;
      } else if (p.k === 'wall') {
        out += `<path class="fg-prop" stroke-width="3" d="M${r1(x)} 18V${FLOOR + 3}"/>`;
        for (let yy = 26; yy < FLOOR; yy += 14) out += `<path class="fg-prop" stroke-width="1.6" d="M${r1(x)} ${yy + 8}L${r1(x + (p.side || 8))} ${yy}"/>`;
      } else if (p.k === 'topmat') {
        out += `<rect class="fg-mat" x="26" y="${p.my == null ? 20 : p.my}" width="188" height="${p.mh || 116}" rx="16"/>`;
      } else if (p.k === 'bolster') {
        out += `<rect class="fg-propfill" x="${r1(x - (p.w || 30) / 2)}" y="${r1(y - 10)}" width="${p.w || 30}" height="10" rx="5"/>`;
      } else if (p.k === 'block') {
        out += `<rect class="fg-propfill" x="${r1(x - 7)}" y="${r1(y - 12)}" width="14" height="12" rx="2.5"/>`;
      }
    }
    return out;
  }

  /** One frame (a single pose) as an SVG fragment in a 240 x 160 box. */
  function frame(spec, opts) {
    const g = solve(spec);
    const pts = [g.P, g.N, g.H, ...g.an, ...g.af, ...g.ln, ...g.lf];
    if (g.fn) pts.push(g.fn); if (g.ff) pts.push(g.ff);
    let dx = 0, dy = 0, cyc = 80;
    if (spec.fit !== false) {
      const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
      dx = 120 - (Math.min(...xs) + Math.max(...xs)) / 2 + (spec.ox || 0);
      dy = spec.ground === false ? 0 : FLOOR - Math.max(...ys) - (spec.lift || 0); // lift: body lying on the floor sits above its centre line
      cyc = (Math.min(...ys) + Math.max(...ys)) / 2 + dy;
    }
    const T = p => [p[0] + dx, p[1] + dy];
    const tg = {};
    for (const k of Object.keys(g)) {
      const v = g[k];
      tg[k] = Array.isArray(v) ? (Array.isArray(v[0]) ? v.map(T) : (typeof v[0] === 'number' ? T(v) : v)) : v;
    }
    const A = anchors(tg);
    let out = '';
    // soft highlight behind the body marks the muscles being stretched
    for (const h of spec.hl || []) {
      const name = typeof h === 'string' ? h : h.at, r = typeof h === 'string' ? 11 : (h.r || 11);
      const c = Array.isArray(name) ? T(name) : A[name];
      if (c) out += `<circle class="fg-hl" cx="${r1(c[0])}" cy="${r1(c[1])}" r="${r}"/><circle class="fg-hlr" cx="${r1(c[0])}" cy="${r1(c[1])}" r="${r}"/>`;
    }
    const propOut = drawProps(spec.props, [dx, dy]);
    const farArm = tg.af, nearArm = tg.an;
    if (tg.front) {
      out += `<g class="fg-line">${limb(tg.lf, WID.th, WID.sh, 'fg-limb')}${tg.ff ? line(tg.lf[2], tg.ff, WID.ft, 'fg-limb') : ''}`
        + `${limb(tg.ln, WID.th, WID.sh, 'fg-limb')}${tg.fn ? line(tg.ln[2], tg.fn, WID.ft, 'fg-limb') : ''}`
        + `${line(tg.hN, tg.hF, WID.hb, 'fg-limb')}${torso(tg, spec, WID.torso + 2)}${line(tg.sN, tg.sF, WID.sb, 'fg-limb')}`
        + `${limb(farArm, WID.ua, WID.fa, 'fg-limb')}${limb(nearArm, WID.ua, WID.fa, 'fg-limb')}</g>`;
    } else {
      out += `<g class="fg-line fg-far">${limb(tg.lf, WID.th, WID.sh, 'fg-limb')}${tg.ff ? line(tg.lf[2], tg.ff, WID.ft, 'fg-limb') : ''}${limb(farArm, WID.ua, WID.fa, 'fg-limb')}</g>`
        + `<g class="fg-line">${limb(tg.ln, WID.th, WID.sh, 'fg-limb')}${tg.fn ? line(tg.ln[2], tg.fn, WID.ft, 'fg-limb') : ''}${torso(tg, spec, WID.torso)}${limb(nearArm, WID.ua, WID.fa, 'fg-limb')}</g>`;
    }
    out += `<path class="fg-limb fg-line" stroke-width="5" d="M${r1(tg.N[0])} ${r1(tg.N[1])}L${r1(mv(tg.N, spec.h == null ? tg.t : spec.h, 6)[0])} ${r1(mv(tg.N, spec.h == null ? tg.t : spec.h, 6)[1])}"/>`;
    out += `<circle class="fg-head" cx="${r1(tg.H[0])}" cy="${r1(tg.H[1])}" r="${HEAD_R}"/>`;
    for (const ar of spec.arrows || []) out += `<path class="fg-arrow" marker-end="url(#fg-tip)" d="${ar}" transform="translate(${r1(dx)} ${r1(dy)})"/>`;
    // spec.s shrinks the figure about the floor centre (used when raised arms would leave the picture)
    // spec.z enlarges the figure about its own centre (top-down views that would otherwise look small on the mat)
    if (spec.z) out = `<g transform="translate(120 ${r1(cyc)}) scale(${spec.z}) translate(-120 ${r1(-cyc)})">${out}</g>`;
    return propOut + (spec.s ? `<g transform="translate(120 ${FLOOR}) scale(${spec.s}) translate(-120 -${FLOOR})">${out}</g>` : out);
  }

  /** Full illustration. spec.frames lets a pose alternate between two shapes (cat and cow). */
  function svg(spec, opts) {
    opts = opts || {};
    const frames = spec.frames ? spec.frames.map(f => Object.assign({}, spec.base || {}, f)) : [spec];
    const body = frames.map((f, i) => `<g class="fg-frame${frames.length > 1 ? ' fg-f' + i : ''}">${frame(f, opts)}</g>`).join('');
    const floor = spec.nofloor ? '' : `<path class="fg-floor" stroke-width="2" d="M22 ${FLOOR + 4}H218"/>`;
    const mat = spec.mat ?`<rect class="fg-mat" x="34" y="${FLOOR + 4}" width="172" height="5" rx="2.5"/>` : '';
    const inner = floor + mat + body;
    const flipped = opts.flip ? `<g transform="translate(240 0) scale(-1 1)">${inner}</g>` : inner;
    return `<svg class="fg${frames.length > 1 ? ' fg-anim' : ''}" viewBox="0 0 240 160" role="img" aria-label="${MR.util.esc(opts.label || 'Yoga pose illustration')}" xmlns="http://www.w3.org/2000/svg">`
      + `<defs><marker id="fg-tip" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" class="fg-tipfill"/></marker></defs>${flipped}</svg>`;
  }
  return { svg, solve, FLOOR, S };
})();

/* 50-store.js */
(function () {
/* Saved settings, reading-plan progress and the in-progress session. Everything lives in localStorage on this device
   (with an in-memory fallback when storage is blocked). Nothing is ever sent anywhere. */
MR.store = (function () {
  const U = MR.util;
  const K = { settings: 'mr.settings.v1', progress: 'mr.progress.v1', session: 'mr.session.v1' };
  const mem = {};
  const read = k => { try { const v = localStorage.getItem(k); if (v != null) return JSON.parse(v); } catch (e) { /* storage blocked or corrupt */ } return mem[k] != null ? JSON.parse(mem[k]) : null; };
  const write = (k, v) => { const s = JSON.stringify(v); mem[k] = s; try { localStorage.setItem(k, s); } catch (e) { /* storage blocked */ } };
  const drop = k => { delete mem[k]; try { localStorage.removeItem(k); } catch (e) { /* storage blocked */ } };

  /** Minutes for every time block. The yoga blocks are retimed to fit (see MR.yoga.build). */
  const MINS = { wake: 2, wakeWork: 5, bible: 15, bibleOff: 20, transit: 2, desk: 15, full: 20, rest: 20, breakfast: 30, ready: 15, shave: 10, exit: 15 };
  const LIMITS = { wake: [1, 15], wakeWork: [1, 15], bible: [5, 60], bibleOff: [5, 60], transit: [1, 15], desk: [5, 30], full: [5, 40], rest: [5, 40], breakfast: [5, 90], ready: [1, 30], shave: [3, 30], exit: [1, 60] };
  const DEFAULTS = { accent: 'amber', custom: '#f0a92b', mode: 'oled', size: 1, serif: false, mono: false, density: 'spacious', progress: 'bar', chime: true, haptic: true, plan: 'year' };

  /** Settings saved by an older version keep what you chose, but a time block you never changed moves to the new default. */
  const VER = 2, OLD_DEFAULTS = { ready: 4 };
  function migrate(x) {
    if (x && x.ver !== VER && x.mins) for (const k of Object.keys(OLD_DEFAULTS)) if (Number(x.mins[k]) === OLD_DEFAULTS[k]) x.mins[k] = MINS[k];
    return x;
  }

  function sanitize(x) {
    const o = Object.assign({}, DEFAULTS, x);
    o.ver = VER;
    o.mins = {};
    for (const k of Object.keys(MINS)) o.mins[k] = U.clamp(Math.round(Number((x.mins || {})[k]) || MINS[k]), LIMITS[k][0], LIMITS[k][1]);
    if (!['oled', 'dark', 'light'].includes(o.mode)) o.mode = DEFAULTS.mode;
    if (!['compact', 'spacious'].includes(o.density)) o.density = DEFAULTS.density;
    if (!['bar', 'dots', 'count'].includes(o.progress)) o.progress = DEFAULTS.progress;
    if (!MR.plans.list.some(p => p.id === o.plan)) o.plan = DEFAULTS.plan;
    if (!/^#[0-9a-f]{6}$/i.test(o.custom)) o.custom = DEFAULTS.custom;
    o.accent = o.accent === 'custom' || ['olive', 'navy', 'amber', 'slate', 'green'].includes(o.accent) ? o.accent : DEFAULTS.accent;
    o.size = U.clamp(Math.round(Number(o.size)), 0, 3) || (Number(o.size) === 0 ? 0 : 1);
    o.serif = !!o.serif; o.mono = !!o.mono; o.chime = !!o.chime; o.haptic = !!o.haptic;
    return o;
  }
  let S = sanitize(migrate(read(K.settings) || {}));
  const subs = [];
  function set(patch) {
    S = sanitize(Object.assign({}, S, patch, patch.mins ? { mins: Object.assign({}, S.mins, patch.mins) } : {}));
    write(K.settings, S);
    subs.forEach(f => f(S));
    return S;
  }

  // ---- reading plan progress: completed days per plan, no calendar ----
  const cap = id => { const p = MR.plans.list.find(q => q.id === id); return p && isFinite(p.days) ? p.days : 99999; };
  let P = Object.assign({ year: 0, half: 0, ntps: 0, prov: 0 }, read(K.progress) || {});
  for (const p of MR.plans.list) P[p.id] = U.clamp(Math.floor(Number(P[p.id])) || 0, 0, cap(p.id));
  const progress = {
    /** Days finished so far. */
    done: id => P[id] || 0,
    /** The day to read next (1-based). */
    day: id => (P[id] || 0) + 1,
    /** Manual editor: n is the day you are about to read. */
    setDay(id, n) { P[id] = U.clamp(Math.floor(Number(n) || 1) - 1, 0, cap(id)); write(K.progress, P); },
    /** Mark day n finished. Never moves backwards. */
    complete(id, n) { P[id] = U.clamp(Math.max(P[id] || 0, Math.floor(n)), 0, cap(id)); write(K.progress, P); },
    cap,
  };

  const session = { load: () => read(K.session), save: s => write(K.session, s), clear: () => drop(K.session) };
  return { settings: () => S, set, onChange: f => subs.push(f), progress, session, MINS, LIMITS, DEFAULTS };
})();

})();

/* 55-routine.js */
(function () {
/* The three mornings and what each step contains. plan() turns one of them into concrete steps with durations in seconds. */
MR.routine = (function () {

  const ring = (cls, inner) => `<div class="ring ${cls || ''}"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="ring-track" cx="50" cy="50" r="45"/><circle class="ring-bar" cx="50" cy="50" r="45" pathLength="100"/></svg><div class="ring-in">${inner || ''}</div></div>`;
  function setRing(root, frac) {
    const b = root && root.querySelector('.ring-bar');
    if (!b) return;
    const f = U.clamp(frac, 0, 1);
    b.style.strokeDashoffset = String(Math.round((1 - f) * 1000) / 10);
    b.style.opacity = f < 0.002 ? '0' : '1'; // a round cap would otherwise leave a dot on an empty ring
  }
  const setText = (node, v) => { if (node && node.textContent !== v) node.textContent = v; };

  // ---- shared chrome of every active screen ----
  const topbar = () => `<header class="topbar"><button class="icon-btn" data-act="quit" aria-label="End this morning">${icon('close')}</button>`
    + `<button class="skip" data-act="skip">Skip Step for Today ${icon('skip')}</button></header>`;
  const pill = () => '<div class="pill" role="timer"><span class="pill-l">Total Morning Time Remaining</span><b class="pill-v" data-total>0:00</b></div>';
  function progress() {
    const S = MR.session.state(), style = MR.store.settings().progress, n = S.plan.length;
    if (style === 'dots') {
      return `<div class="prog prog-dots" role="img" aria-label="Step ${S.i + 1} of ${n}">${S.plan.map((st, i) => `<span class="dot ${i === S.i ? 'cur' : S.res[i] === 'skip' ? 'skip' : i < S.i ? 'done' : 'todo'}" title="${esc(st.short || st.name)}"></span>`).join('')}</div>`;
    }
    if (style === 'count') return `<div class="prog prog-count">Step <b>${S.i + 1}</b> of ${n}</div>`;
    return `<div class="prog prog-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Morning progress"><i data-bar></i></div>`;
  }
  /** Updates the pill and the bar on a screen. */
  function paint(root, now) {
    setText(root.querySelector('[data-total]'), U.fmt(MR.session.totalLeft(now)));
    const b = root.querySelector('[data-bar]');
    if (b) b.style.width = (MR.session.overall(now) * 100).toFixed(1) + '%';
  }
  /** "Up next" line shared by the step screens. */
  function upNext() {
    const S = MR.session.state(), nx = S.plan[S.i + 1];
    return `<p class="upnext"><span>Up next</span> ${nx ? esc(nx.name) : 'You are done'}</p>`;
  }
  const NEXT_LABEL = 'Finished Early / Next ➔';
  return { icon, el, logo, show, current: () => current, ring, setRing, setText, topbar, pill, progress, paint, upNext, NEXT_LABEL };
})();

/* Step screens: the plain timer step (with optional phases), the yoga pose cards, and the end-of-morning summary. */
MR.ui.cueStep = function () {
  const ui = MR.ui, U = MR.util, esc = U.esc, S = MR.session, st = S.cur();
  const phases = st.phases;
  const body = phases
    ? `<div class="phase"><p class="phase-k" data-pk></p><h2 data-pt></h2><p data-pp></p></div><div class="pchips">${phases.map((p, i) => `<span class="pchip" data-pi="${i}">${esc(p.label)}</span>`).join('')}</div>`
    : `<ul class="cues">${st.cues.map(c => `<li>${esc(c)}</li>`).join('')}</ul>`;
  const node = ui.el(`<section class="step cue">
    ${ui.topbar()}${ui.pill()}${ui.progress()}
    <main class="body">
      <h1 class="title">${esc(st.name)}</h1>
      ${ui.ring('big', '<b class="time" data-time>0:00</b><small>left in this step</small>')}
      ${body}
      ${st.mode === 'min' ? `<button class="chip plus" data-act="plus5" aria-label="Add five minutes">${ui.icon('plus')} 5 min</button>` : ''}
      ${ui.upNext()}
    </main>
    <footer class="dock"><button class="primary" data-act="next">${ui.NEXT_LABEL}</button></footer>
  </section>`);
  const time = node.querySelector('[data-time]');
  let shown = -1;
  function showPhase(k) {
    const p = phases[k];
    node.querySelector('[data-pk]').textContent = `Part ${k + 1} of ${phases.length}`;
    node.querySelector('[data-pt]').textContent = p.label;
    node.querySelector('[data-pp]').textContent = p.text;
    node.querySelectorAll('.pchip').forEach((c, i) => { c.classList.toggle('on', i === k); c.classList.toggle('past', i < k); });
  }
  return { el: node, update(now) {
    ui.paint(node, now);
    ui.setText(time, U.fmt(S.left(now)));
    ui.setRing(node, S.left(now) / st.dur);
    if (phases) {
      const k = S.phaseIndex(now);
      if (k !== shown) { const first = shown === -1; shown = k; showPhase(k); if (!first) MR.fx.cue('pose'); }

};

/** Full-screen focus mode: passage cards to tick off, original prompts, and a quiet countdown. */
MR.ui.focus = function () {
  const ui = MR.ui, U = MR.util, esc = U.esc, S = MR.session;
  const node = ui.el('<div class="focus" role="dialog" aria-modal="true" aria-label="Reading"></div>');
  const section = (h, body) => `<section class="gsec"><h2>${esc(h)}</h2>${body}</section>`;
  const list = a => `<ul>${a.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;

  function content() {
    const R = S.state().read;
    let kicker, title, items, guide;
    if (R.kind === 'devo') {
      const d = MR.devotionals.find(x => x.id === R.devo);
      kicker = 'Devotional'; title = d.title;
      items = d.passages.map(p => ({ label: p.ref, sub: p.note }));
      guide = section('Where to begin', `<p>${esc(d.blurb)}</p>`) + section('As you read', list(d.reflect)) + section('Pray', `<p>${esc(d.pray)}</p>`);
    } else {
      const d = MR.plans.day(R.plan, R.day), g = MR.guide.forDay(d);
      kicker = MR.ui.dayLine(R.plan, R.day); title = 'Today’s reading';
      items = d.passages.map(p => ({ label: p.label, sub: `about ${mins(p.words)} min` }));
      guide = section('Begin with prayer', `<p>${esc(g.open)}</p>`) + section('As you read', list(g.cues)) + section('When you finish', `<p>${esc(g.reflect)}</p>`) + section('Close in prayer', `<p>${esc(g.close)}</p>`);
    }
    return `<header class="focus-bar">
        <button class="ghost-btn" data-act="focus-back">${ui.icon('back')} Choices</button>

      </header>
      <div class="focus-scroll"><article class="read">
        <p class="kicker">${esc(kicker)}</p><h1>${esc(title)}</h1>

          <div><b>${esc(it.label)}</b><small>${esc(it.sub)}</small></div></li>`).join('')}</ol>
        <p class="tickstat" data-ts></p>
        <div class="guide">${guide}</div>
      </article></div>

  function refresh() {
    const s = S.state(), R = s.read;
    node.querySelectorAll('.pcard').forEach((c, i) => {
      const on = !!R.ticks[i], b = c.querySelector('.tick');

    + `<button data-${attr}="${id}" data-d="1" aria-label="Increase ${esc(label)}">${ui.icon('plus')}</button></div>`;
  const toggle = (key, label, test) => `<div class="step-row"><span>${label}</span><div class="tg"><button class="ghost sm" data-test="${test}">Test</button>`
    + `<button class="switch" role="switch" data-toggle="${key}" aria-checked="false" aria-label="${esc(label)}"><i></i></button></div></div>`;

  function build() {
    const colors = `<div class="swatches">${T.PRESETS.map(p => `<button class="swatch" data-set="accent" data-v="${p.id}" style="--sw:${p.hex}" aria-pressed="false"><i></i><span>${p.name}</span></button>`).join('')}</div>
      <p class="label">Custom color</p>
      <div class="picker">
        <div class="wheel-wrap" data-wheel><canvas aria-label="Color wheel. Drag to pick a color"></canvas><i class="wdim" data-dim></i><i class="wdot" data-dot></i></div>
        <div class="pk-controls">
          <label class="rng">Brightness<input type="range" min="0" max="100" data-pk="v"></label>
          ${['Red', 'Green', 'Blue'].map((c, i) => `<label class="rng">${c}<input type="range" min="0" max="255" data-pk="c${i}"><output data-out="${i}"></output></label>`).join('')}
          <label class="hexl">Hex<input type="text" maxlength="7" spellcheck="false" autocapitalize="off" autocomplete="off" data-pk="hex" aria-label="Hex color"></label>
        </div>
      </div>
      <div class="preview" aria-hidden="true"><span class="pv-btn">Start</span><span class="pv-ring"></span><span class="pv-txt">12:34</span></div>
      <p class="hint" data-adj hidden>On this background your color is shown a little lighter or darker so it stays readable.</p>`;
    const display = `<p class="label">Theme mode</p>${seg('mode', [['oled', 'OLED Black'], ['dark', 'Dark'], ['light', 'Light']])}
      <p class="label">Cards</p>${seg('density', [['compact', 'Compact'], ['spacious', 'Spacious']])}
      <p class="label">Progress style</p>${seg('progress', [['bar', 'Solid Bar'], ['dots', 'Segmented Dots'], ['count', 'Step Counter']])}`;
    const text = `<p class="label">Font size <b data-size-name></b></p>
      <input class="size" type="range" min="0" max="3" step="1" data-range="size" aria-label="Font size">
      <div class="size-l" aria-hidden="true">${T.SIZE_NAMES.map(n => `<span>${n}</span>`).join('')}</div>
      <p class="label">Font style</p>
      <div class="seg stack" role="group"><button data-font="sans" aria-pressed="false">Sans-Serif</button><button data-font="serif" aria-pressed="false">Serif for Bible text</button><button data-font="mono" aria-pressed="false">Monospace for timers</button></div>
      <div class="sample"><p class="s-bible">Pray, then read slowly.</p><p class="s-time">12:34</p></div>`;
    const times = `<div class="rows">${TIMES.map(([k, l, n]) => `<div class="step-row"><span>${l}<small>${n}</small></span>${stepper('step', k, `${l}, ${n}`)}</div>`).join('')}</div>
      <p class="hint" data-totals></p><button class="ghost" data-reset="times">Reset times</button>`;
    const days = `<p class="hint">Plans follow completed days, not the calendar. Missing a day just keeps you on the same day. Set the day you will read next.</p>
      <div class="rows">${MR.plans.list.map(p => `<div class="step-row"><span>${esc(p.name)}<small data-dsub="${p.id}"></small></span>${stepper('dstep', p.id, p.name + ' day')}</div>`).join('')}</div>`;
    const sound = `<div class="rows">${toggle('chime', 'Chime when a step changes', 'sound')}${toggle('haptic', 'Vibrate when a step changes', 'buzz')}</div>
      <p class="hint" data-buzzhint></p>`;
    return `<div class="settings-head"><h2>Settings</h2><button class="icon-btn" data-act="settings-close" aria-label="Close settings">${ui.icon('close')}</button></div>
      ${sec('Color', colors, true)}${sec('Display', display)}${sec('Text', text)}${sec('Routine times', times)}${sec('Bible reading days', days)}${sec('Sound and touch', sound)}`;
  }

  // ---- color wheel and RGB sliders ----
  function makePicker(host) {
    const SIZE = 192, dpr = Math.min(2, window.devicePixelRatio || 1), N = Math.round(SIZE * dpr), R = N / 2;
    const wrap = host.querySelector('[data-wheel]'), cv = wrap.querySelector('canvas'), dot = wrap.querySelector('[data-dot]'), dim = wrap.querySelector('[data-dim]');
    const hexIn = host.querySelector('[data-pk="hex"]'), vIn = host.querySelector('[data-pk="v"]');
    cv.width = cv.height = N; cv.style.width = cv.style.height = SIZE + 'px';
    const g = cv.getContext('2d'), img = g.createImageData(N, N);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const dx = x + 0.5 - R, dy = y + 0.5 - R, r = Math.hypot(dx, dy), i = (y * N + x) * 4;
      if (r > R) continue;
      let h = (Math.atan2(dy, dx) * 180) / Math.PI; if (h < 0) h += 360;
      const c = U.hsvToRgb(h, Math.min(1, r / (R - 1)), 1);
      img.data[i] = c[0]; img.data[i + 1] = c[1]; img.data[i + 2] = c[2]; img.data[i + 3] = Math.round(255 * U.clamp(R - r, 0, 1));
    }
    g.putImageData(img, 0, 0);
    const hsv = { h: 40, s: 0.8, v: 0.9 };
    let pending = false;
    const rgb = () => U.hsvToRgb(hsv.h, hsv.s, hsv.v).map(Math.round);
    function paint(skipHex) {
      const c = rgb(), rad = (hsv.h * Math.PI) / 180, rr = hsv.s * (SIZE / 2 - 1);
      dot.style.left = SIZE / 2 + Math.cos(rad) * rr + 'px'; dot.style.top = SIZE / 2 + Math.sin(rad) * rr + 'px';
      dot.style.background = U.rgbToHex(...c);
      dim.style.opacity = String(1 - hsv.v);
      vIn.value = String(Math.round(hsv.v * 100));
      c.forEach((v, i) => { host.querySelector(`[data-pk="c${i}"]`).value = String(v); host.querySelector(`[data-out="${i}"]`).textContent = String(v); });
      if (!skipHex) hexIn.value = U.rgbToHex(...c);
    }
    function commit() {
      paint();
      if (pending) return;
      pending = true;
      requestAnimationFrame(() => { pending = false; store.set({ accent: 'custom', custom: U.rgbToHex(...rgb()) }); T.apply(store.settings()); syncLight(); });
    }
    function fromPointer(e) {
      const b = cv.getBoundingClientRect(), dx = e.clientX - (b.left + b.width / 2), dy = e.clientY - (b.top + b.height / 2);
      let h = (Math.atan2(dy, dx) * 180) / Math.PI; if (h < 0) h += 360;
      hsv.h = h; hsv.s = U.clamp(Math.hypot(dx, dy) / (b.width / 2), 0, 1); commit();
    }
    let drag = false;
    wrap.addEventListener('pointerdown', e => { drag = true; try { wrap.setPointerCapture(e.pointerId); } catch (x) { /* older browsers */ } fromPointer(e); e.preventDefault(); });
    wrap.addEventListener('pointermove', e => { if (drag) fromPointer(e); });
    ['pointerup', 'pointercancel'].forEach(t => wrap.addEventListener(t, () => { drag = false; }));
    vIn.addEventListener('input', () => { hsv.v = U.clamp(Number(vIn.value) / 100, 0, 1); commit(); });
    [0, 1, 2].forEach(i => host.querySelector(`[data-pk="c${i}"]`).addEventListener('input', () => {
      const c = [0, 1, 2].map(k => Number(host.querySelector(`[data-pk="c${k}"]`).value));
      const [h, s, v] = U.rgbToHsv(...c);
      if (s > 0) hsv.h = h; hsv.s = s; hsv.v = v; commit();
    }));
    hexIn.addEventListener('input', () => {
      let t = hexIn.value.trim(); if (t && t[0] !== '#') t = '#' + t;
      if (!/^#[0-9a-f]{6}$/i.test(t)) return;
      const [h, s, v] = U.rgbToHsv(...U.hexToRgb(t));
      if (s > 0) hsv.h = h; hsv.s = s; hsv.v = v; paint(true); commit();
    });
    return { set(hex) { const [h, s, v] = U.rgbToHsv(...U.hexToRgb(hex)); if (s > 0) hsv.h = h; hsv.s = s; hsv.v = v; paint(); } };
  }

  // ---- pushing saved state into the controls ----
  function pressed(sel, on) { root.querySelectorAll(sel).forEach(b => b.setAttribute('aria-pressed', String(on(b)))); }
  function syncLight() {
    const s = store.settings(), a = T.accent(s);
    pressed('[data-set="accent"]', b => b.dataset.v === s.accent);
    root.querySelector('[data-adj]').hidden = a.base.toLowerCase() === a.fill.toLowerCase();
  }
  function totals() {
    const s = store.settings();
    return MR.routine.SCENARIOS.map(sc => `${sc.label.replace('Work Day — ', '')}: ${sc.flexible ? 'about ' : ''}${Math.round(MR.routine.total(sc.id, s) / 60)} min`).join('  ·  ');
  }
  function sync() {
    const s = store.settings();
    syncLight();
    pressed('[data-set="mode"]', b => b.dataset.v === s.mode);
    pressed('[data-set="density"]', b => b.dataset.v === s.density);
    pressed('[data-set="progress"]', b => b.dataset.v === s.progress);
    pressed('[data-font]', b => (b.dataset.font === 'sans' ? !s.serif && !s.mono : b.dataset.font === 'serif' ? s.serif : s.mono));
    root.querySelector('[data-range="size"]').value = String(s.size);
    root.querySelector('[data-size-name]').textContent = T.SIZE_NAMES[s.size];
    for (const [k] of TIMES) root.querySelector(`[data-min="${k}"]`).textContent = s.mins[k] + ' min';
    root.querySelector('[data-totals]').textContent = totals();
    for (const p of MR.plans.list) {
      const inp = root.querySelector(`[data-day="${p.id}"]`);
      if (document.activeElement !== inp) inp.value = String(store.progress.day(p.id));
      root.querySelector(`[data-dsub="${p.id}"]`).textContent = `${store.progress.done(p.id)} day${store.progress.done(p.id) === 1 ? '' : 's'} finished`;
    }
    root.querySelectorAll('[data-toggle]').forEach(b => b.setAttribute('aria-checked', String(!!s[b.dataset.toggle])));
    root.querySelector('[data-buzzhint]').textContent = MR.fx.canBuzz() ? 'Vibration works on most Android phones.' : 'This device does not offer web vibration (iPhones never do), so only the chime will play.';
  }

  function onClick(e) {
    const t = e.target.closest('button');
    if (!t || !root.contains(t)) return;
    const s = store.settings();
    MR.fx.unlock();
    if (t.dataset.set) {
      const key = t.dataset.set; store.set({ [key]: key === 'size' ? Number(t.dataset.v) : t.dataset.v });
      if (key === 'accent') picker.set(T.pick(store.settings()));
    } else if (t.dataset.font) {
      const f = t.dataset.font;
      store.set(f === 'sans' ? { serif: false, mono: false } : f === 'serif' ? { serif: !s.serif } : { mono: !s.mono });
    } else if (t.dataset.step) {
      const k = t.dataset.step; store.set({ mins: { [k]: s.mins[k] + Number(t.dataset.d) } });
    } else if (t.dataset.dstep) {
      const id = t.dataset.dstep; store.progress.setDay(id, store.progress.day(id) + Number(t.dataset.d));
    } else if (t.dataset.toggle) {
      store.set({ [t.dataset.toggle]: !s[t.dataset.toggle] });
    } else if (t.dataset.test) {
      if (t.dataset.test === 'sound') MR.fx.sound('test'); else MR.fx.buzz('test');
    } else if (t.dataset.reset) {
      store.set({ mins: store.MINS });
    } else return;
    T.apply(store.settings()); sync();
  }
  function onInput(e) {
    const t = e.target;
    if (t.dataset.range === 'size') { store.set({ size: Number(t.value) }); T.apply(store.settings()); sync(); }
  }
  function onChange(e) {
    const t = e.target;
    if (t.dataset.day) { store.progress.setDay(t.dataset.day, Number(t.value)); sync(); }
  }
  function onKey(e) { if (e.key === 'Escape') close(); }

  function open() {
    if (root) return;
    opener = document.activeElement;
    backdrop = ui.el('<div class="backdrop" data-act="settings-close"></div>');
    root = ui.el(`<section class="settings" role="dialog" aria-modal="true" aria-label="Settings" tabindex="-1">${build()}</section>`);
    document.body.append(backdrop, root);
    picker = makePicker(root);
    picker.set(T.pick(store.settings()));
    root.addEventListener('click', onClick); root.addEventListener('input', onInput); root.addEventListener('change', onChange);
    document.addEventListener('keydown', onKey);
    sync();
    root.focus({ preventScroll: true });
  }
  function close() {
    if (!root) return;
    document.removeEventListener('keydown', onKey);
    root.remove(); backdrop.remove(); root = backdrop = picker = null;
    if (opener && opener.focus) opener.focus({ preventScroll: true });
  }
  return { open, close, isOpen: () => !!root };
})();

})();

/* 90-app.js */
(function () {
/* App shell: which screen is showing, what each button does, the clock that drives the session, and start-up. */
MR.app = (function () {
  const ui = MR.ui, S = MR.session, fx = MR.fx, store = MR.store;
  let screen = null, focus = null;
  const now = () => Date.now();

  function go(sc, dir) { closeFocus(true); screen = sc; ui.show(sc, dir); }

  // ---- focus mode lives above the stage and closes whenever the step changes ----
  function openFocus() {
    if (focus || !S.active()) return;
    S.setFocus(true);
    focus = ui.focus();
    document.getElementById('focus-root').appendChild(focus.el);
    focus.update(now());
  }
  function closeFocus(silent) {
    if (!focus) return;
    focus.el.remove(); focus = null;
    if (!silent && S.state()) S.setFocus(false);
  }

  function showHome(dir) { fx.release(); go(ui.home(), dir); }
  function showStep(dir) {
    const st = S.cur(), wasFocus = S.state().focus;
    go(st.screen === 'bible' ? ui.bibleStep() : st.screen === 'yoga' ? ui.yogaStep() : ui.cueStep(), dir);
    screen.update(now());
    if (wasFocus && st.screen === 'bible') openFocus();
  }
  function showSummary() { fx.release(); go(ui.summary(), 'fwd'); fx.cue('done'); }
  function refreshScreens() {
    const t = now();
    if (screen.refresh) screen.refresh();
    if (focus) focus.refresh();
    screen.update(t); if (focus) focus.update(t);
  }

  /** What to do after the session changed. auto = a timer ran out (chime), otherwise a button press (silent). */
  function handle(evs, auto) {
    if (!evs.length) return;
    if (evs.some(e => e.t === 'finish')) return showSummary();
    if (evs.some(e => e.t === 'step')) { if (auto) fx.cue('step'); return showStep('fwd'); }
    if (evs.some(e => e.t === 'hold')) { if (auto) fx.cue('step'); refreshScreens(); }
  }
  function tick() {
    if (!S.active()) return;
    const t = now(), evs = S.tick(t);
    if (evs.length) return handle(evs, true);
    screen.update(t);
    if (focus) focus.update(t);
  }

  function confirmQuit() {
    if (document.querySelector('.sheet-wrap')) return;
    const sheet = ui.el(`<div class="sheet-wrap"><div class="backdrop" data-act="quit-cancel"></div>
      <div class="sheet" role="alertdialog" aria-modal="true" aria-label="End this morning?"><h2>End this morning?</h2>
      <p>The timers stop and you go back to the start. A reading you already finished stays counted.</p>
      <button class="primary" data-act="quit-cancel">Keep going</button><button class="danger" data-act="quit-confirm">End morning</button></div></div>`);
    document.body.appendChild(sheet);
    sheet.querySelector('.primary').focus();
  }
  const closeSheet = () => { const s = document.querySelector('.sheet-wrap'); if (s) s.remove(); };

  const A = {
    start() { ui.settings.close(); go(ui.selector(), 'fwd'); },
    back() { showHome('back'); },
    mode(b) { S.start(b.dataset.id, now()); fx.keepAwake(); showStep('fwd'); },
    settings() { ui.settings.open(); },
    'settings-close'() { ui.settings.close(); if (screen && screen.refresh) screen.refresh(); },
    quit() { confirmQuit(); },
    'quit-cancel'() { closeSheet(); },
    'quit-confirm'() { closeSheet(); closeFocus(true); S.quit(); showHome('back'); },
    skip() { handle(S.skip(now())); },
    next() { handle(S.next(now())); },
    plus5() { S.extend(300); refreshScreens(); },
    'pose-next'() { const evs = S.skipPose(now()); if (evs.length) handle(evs); else screen.update(now()); },
    'pose-prev'() { S.prevPose(now()); screen.update(now()); },
    plan(b) { S.pickPlan(b.dataset.id); refreshScreens(); },
    devo(b) { S.pickDevo(b.dataset.id); refreshScreens(); },
    read() { openFocus(); },
    'restart-plan'() { const id = S.state().read.plan; store.progress.setDay(id, 1); S.pickPlan(id); refreshScreens(); },
    'focus-back'() { closeFocus(); screen.refresh(); },
    tick(b) { S.toggleTick(Number(b.dataset.i)); refreshScreens(); },
    advance() { if (S.advanceDay(now())) { if (focus) focus.rebuild(); refreshScreens(); } },
    done() { S.quit(); showHome('back'); },
  };
  function onClick(e) {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    fx.unlock();
    const fn = A[b.dataset.act];
    if (fn) { e.preventDefault(); fn(b); }
  }

  function boot() {
    MR.theme.apply(store.settings());
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { tick(); if (S.active()) fx.keepAwake(); } });
    window.addEventListener('pageshow', tick);
    if (S.resume(now())) {
      // a morning that was already running comes straight back, caught up to where the clock says it should be
      if (S.tick(now()).some(e => e.t === 'finish')) showSummary(); else { showStep('none'); fx.keepAwake(); }
    } else showHome('none');
    setInterval(tick, 250);
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { /* offline support is optional */ });
  }
  return { boot, go, A };
})();
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', MR.app.boot); else MR.app.boot();

})();
</script>
